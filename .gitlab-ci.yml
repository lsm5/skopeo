# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
workflow:
  rules:
    # Ref: https://docs.gitlab.com/ee/ci/yaml/workflow.html#switch-between-branch-pipelines-and-merge-request-pipelines
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - security
  - test

include:
  - template: Security/SAST.gitlab-ci.yml

sast:
  stage: security
  tags:
    - itup-alm-x86
  allow_failure: true  # Don't block pipeline if SAST finds issues

tmt-tests:
  stage: test
  image: images.paas.redhat.com/rhelse/tfcli:latest
  tags:
    - itup-alm-x86
  cache:
    paths:
      - .dnf/
  script:
    - |
      # Handle both MR and branch pipelines
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "Running Testing Farm for merge request pipeline..."
        echo "Command: testing-farm request --git-url $CI_MERGE_REQUEST_SOURCE_PROJECT_URL --git-ref $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        testing-farm request --compose RHEL-9.7.0-Nightly --arch aarch64,x86_64 --git-url $CI_MERGE_REQUEST_SOURCE_PROJECT_URL --git-ref $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      else
        echo "Running Testing Farm for branch pipeline..."
        echo "Command: testing-farm request --git-url $CI_PROJECT_URL --git-ref $CI_COMMIT_REF_NAME"
        testing-farm request --compose RHEL-9.7.0-Nightly --arch aarch64,x86_64 --git-url $CI_PROJECT_URL --git-ref $CI_COMMIT_REF_NAME
      fi
  timeout: 60m
